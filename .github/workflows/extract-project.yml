name: Extract FXWOLVER project archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project source
        run: |
          set -euo pipefail
          unzip -o -q ./-FXWOLVER_Terminal_Phase1.6.zip -d .
          test -f FXWOLVER/public/index.html
          test -f FXWOLVER/backend/app/main.py
          test -f FXWOLVER/frontend/package.json
