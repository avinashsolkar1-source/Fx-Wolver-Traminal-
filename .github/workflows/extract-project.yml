name: Extract FXWOLVER project archive

on:
  push:

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[archive-extract]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract project source
        run: |
          set -euo pipefail
          archive="./-FXWOLVER_Terminal_Phase1.6.zip"
          test -f "$archive"
          unzip -o -q "$archive" -d .
          test -f FXWOLVER/public/index.html
          test -f FXWOLVER/backend/app/main.py
          test -f FXWOLVER/frontend/package.json
      - name: Commit extracted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FXWOLVER/
          if git diff --cached --quiet; then
            echo "No extracted source changes."
          else
            git commit -m "Extract FXWOLVER project source [archive-extract]"
            git push
          fi
